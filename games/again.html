<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>again — Titanium Creations</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <button id="jolly-btn" class="jolly-button" aria-label="Play jolly audio">jolly</button>

    <h1 id="main-text">again.</h1>
    <div>
        <a href="https://phoenixpulze29.itch.io/again-2" class="button" target="_blank">play again.</a>
        <a href="../index.html" class="button">back to home</a>
    </div>
    <h2 id="tree">🎄</h2>

    <audio id="jolly-audio" src="assets/jolly.mp3"></audio>

    <script>
        const t = document.getElementById("tree"),
              m = document.getElementById("main-text"),
              f = document.getElementById("footer-text"),
              b = document.body,
              o = "again.",
              h = "merry christmas!",
              oF = "2026 titanium creations",
              fF = "2026 jolly titanium creations";

        const jBtn = document.getElementById('jolly-btn'),
              jAud = document.getElementById('jolly-audio');

        if (jBtn && jAud) {
            jBtn.addEventListener('click', () => {
                jAud.currentTime = 0;
                jAud.play();
            });
        }

        function n(x, y) { return x > window.innerWidth - 80 && y > window.innerHeight - 80 }
        document.addEventListener("mousemove", e => {
            if (n(e.clientX, e.clientY)) {
                if (!t.style.opacity || t.style.opacity == "0") {
                    t.style.opacity = "1";
                    m.textContent = h;
                    if (f) f.textContent = fF;
                    b.style.background = "#ffe0e0";
                    b.style.color = "#d32f2f";
                }
            } else {
                if (t.style.opacity == "1") {
                    t.style.opacity = "0";
                    m.textContent = o;
                    if (f) f.textContent = oF;
                    b.style.background = "#fff";
                    b.style.color = "#111";
                }
            }
        });
    </script>
</body>
<footer id="footer-text">

</footer>
</html>
