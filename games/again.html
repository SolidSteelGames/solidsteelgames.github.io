<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>again — Titanium Creations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff;
            color: #111;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 16px;
            overflow: hidden;
        }
        h1 { font-size: clamp(2rem, 8vw, 3rem) }
        footer { margin-top: 32px; font-size: .9rem; color: #777 }
        .button {
            margin-top: 12px;
            padding: 12px 32px;
            font-size: 1.1rem;
            border: 2px solid #111;
            background: transparent;
            color: #111;
            cursor: pointer;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover { background: #d32f2f; color: #fff }
        #tree {
            font-size: 2rem;
            opacity: 0;
            position: fixed;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
        }

        /* Jolly button: small, top-left */
        .jolly-button {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 6px 10px;
            font-size: .9rem;
            border: 1px solid #111;
            background: transparent;
            color: #111;
            cursor: pointer;
            border-radius: 6px;
            z-index: 1000;
        }
        .jolly-button:hover { background: #d32f2f; color: #fff }
    </style>
</head>

<body>
    <button id="jolly-btn" class="jolly-button" aria-label="Play jolly audio">jolly</button>

    <h1 id="main-text">again.</h1>
    <div>
        <a href="https://phoenixpulze29.itch.io/again-2" class="button" target="_blank">play again.</a>
        <a href="../index.html" class="button">back to home</a>
    </div>
    <h2 id="tree">🎄</h2>

    <audio id="jolly-audio" src="assets/jolly.mp3"></audio>

    <script>
        const t = document.getElementById("tree"),
              m = document.getElementById("main-text"),
              f = document.getElementById("footer-text"),
              b = document.body,
              o = "again.",
              h = "merry christmas!",
              oF = "2025 titanium creations",
              fF = "2025 jolly titanium creations";

        const jBtn = document.getElementById('jolly-btn'),
              jAud = document.getElementById('jolly-audio');

        if (jBtn && jAud) {
            jBtn.addEventListener('click', () => {
                jAud.currentTime = 0;
                jAud.play();
            });
        }

        function n(x, y) { return x > window.innerWidth - 80 && y > window.innerHeight - 80 }
        document.addEventListener("mousemove", e => {
            if (n(e.clientX, e.clientY)) {
                if (!t.style.opacity || t.style.opacity == "0") {
                    t.style.opacity = "1";
                    m.textContent = h;
                    if (f) f.textContent = fF;
                    b.style.background = "#ffe0e0";
                    b.style.color = "#d32f2f";
                }
            } else {
                if (t.style.opacity == "1") {
                    t.style.opacity = "0";
                    m.textContent = o;
                    if (f) f.textContent = oF;
                    b.style.background = "#fff";
                    b.style.color = "#111";
                }
            }
        });
    </script>
</body>
<footer id="footer-text">
    <a href="https://titanium-creations.github.io/games/again.html">Again</a> © 2025 by <a href="https://titanium-creations.github.io/">Titanium Creations</a> is licensed under <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/">CC BY-NC-ND 4.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/nd.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;">
</footer>
</html>
