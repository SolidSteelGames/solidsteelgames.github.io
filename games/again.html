<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>again — Titanium Creations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff;
            color: #111;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 16px;
            overflow: hidden;
        }
        h1 { font-size: clamp(2rem, 8vw, 3rem) }
        footer { margin-top: 32px; font-size: .9rem; color: #777 }
        .button {
            margin-top: 12px;
            padding: 12px 32px;
            font-size: 1.1rem;
            border: 2px solid #111;
            background: transparent;
            color: #111;
            cursor: pointer;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover { background: #d32f2f; color: #fff }
        #tree {
            font-size: 2rem;
            opacity: 0;
            position: fixed;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 id="main-text">again.</h1>
    <div>
        <a href="https://phoenixpulze29.itch.io/again-2" class="button" target="_blank">play again.</a>
        <a href="../index.html" class="button">back to home</a>
    </div>
    <footer id="footer-text">2025 titanium creations</footer>
    <h2 id="tree">🎄</h2>

    <script>
        const t = document.getElementById("tree"),
              m = document.getElementById("main-text"),
              f = document.getElementById("footer-text"),
              b = document.body,
              o = "again.",
              h = "merry christmas!",
              oF = "2025 titanium creations",
              fF = "2025 jolly titanium creations";
        function n(x, y) { return x > window.innerWidth - 80 && y > window.innerHeight - 80 }
        document.addEventListener("mousemove", e => {
            if (n(e.clientX, e.clientY)) {
                if (!t.style.opacity || t.style.opacity == "0") {
                    t.style.opacity = "1";
                    m.textContent = h;
                    f.textContent = fF;
                    b.style.background = "#ffe0e0";
                    b.style.color = "#d32f2f";
                }
            } else {
                if (t.style.opacity == "1") {
                    t.style.opacity = "0";
                    m.textContent = o;
                    f.textContent = oF;
                    b.style.background = "#fff";
                    b.style.color = "#111";
                }
            }
        });
    </script>
</body>

</html>
