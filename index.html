<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanium Creations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff;
            color: #111;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 16px;
            overflow: hidden
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3rem)
        }

        footer {
            margin-top: 32px;
            font-size: .9rem;
            color: #777
        }

        .button {
            margin-top: 24px;
            padding: 12px 32px;
            font-size: 1.1rem;
            border: 2px solid #111;
            background: transparent;
            color: #111;
            cursor: pointer;
            border-radius: 6px;
            text-decoration: none
        }

        .button:hover {
            background: #d32f2f;
            color: #fff
        }

        #tree {
            font-size: 2rem;
            opacity: 0;
            position: fixed;
            bottom: 20px;
            right: 20px;
            cursor: pointer
        }
        /* Jolly button: small, top-left */
        .jolly-button {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 6px 10px;
            font-size: .9rem;
            border: 1px solid #111;
            background: transparent;
            color: #111;
            cursor: pointer;
            border-radius: 6px;
            z-index: 1000;
        }
        .jolly-button:hover { background: #d32f2f; color: #fff }
    </style>
</head>

<body>
    <button id="jolly-btn" class="jolly-button" aria-label="Play jolly audio">jolly</button>
    <h1 id="main-text">coming soon.</h1>
    <a href="games/again.html" class="button">play again.</a>
    <footer id="footer-text">2025 titanium creations</footer>
    <h2 id="tree">🎄</h2>
    <audio id="jolly-audio" src="games/assets/jolly.mp3"></audio>
    <script>
       const jBtn = document.getElementById('jolly-btn'),
              jAud = document.getElementById('jolly-audio');

        if (jBtn && jAud) {
            jBtn.addEventListener('click', () => {
                jAud.currentTime = 0;
                jAud.play();
            });
        }
    
    const t = document.getElementById("tree"), m = document.getElementById("main-text"), f = document.getElementById("footer-text"), b = document.body, o = "coming soon.", h = "merry christmas!", oF = "2025 titanium creations", fF = "2025 jolly titanium creations"; function n(x, y) { return x > window.innerWidth - 80 && y > window.innerHeight - 80 } document.addEventListener("mousemove", e => { if (n(e.clientX, e.clientY)) { if (!t.style.opacity || t.style.opacity == "0") { t.style.opacity = "1"; m.textContent = h; f.textContent = fF; b.style.background = "#ffe0e0"; b.style.color = "#d32f2f" } } else { if (t.style.opacity == "1") { t.style.opacity = "0"; m.textContent = o; f.textContent = oF; b.style.background = "#fff"; b.style.color = "#111" } } });</script>
</body>

</html>
